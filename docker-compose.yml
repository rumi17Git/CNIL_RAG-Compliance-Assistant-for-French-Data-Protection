networks:
  rag_network:
    driver: bridge

volumes:
  qdrant_data:
  hf_cache:

services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - rag_network
    healthcheck:
      # The Qdrant image has no curl, so open a TCP connection with bash instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingestion:
    build: ./ingestion_service
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - rag_network
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s  # first start downloads the embedding model

  generation:
    build:
      context: .                              # project root, so rag_core is included
      dockerfile: generation_service/dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - rag_network
    extra_hosts:
      # Lets the container reach Ollama running on your machine (needed on Linux)
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s  # first start downloads the embedding model and reranker

  frontend:
    build: ./frontend
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://generation:8002/query
    networks:
      - rag_network
    depends_on:
      generation:
        condition: service_healthy
